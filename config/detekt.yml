# Overrides on top of detekt's default config.
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  WildcardImport:
    active: false
complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 16
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
