# Overrides on top of detekt's default config.
complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 16
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 25
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

# Advisory rules relaxed for this code base (Compose previews, defensive catch blocks around platform APIs).
style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    ignoreAnnotated: ['Preview']
exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
